# Ultrawide: the gameplay camera update (sub_826B4F70) takes its aspect (f1)
# from the 1280x720 render target, then stores the view window width (f13) and
# height (f0) at +92 / +96 and their reciprocals at +100 / +104. The hook widens
# the width only, so the extra width is added view (hor+). sub_82B76100 is the
# UI camera and is left alone.
[[midasm_hook]]
name = "Nhl3on3GameCameraWindowHook"
address = 0x826B5538
registers = ["r25", "f0", "f1", "f13"]

# Ultrawide: sub_82724A88 initialises the screen object with a 1280x720 float
# size, from which the gameplay camera derives its aspect. The hook widens the
# width (f0) before it is stored at +16.
[[midasm_hook]]
name = "Nhl3on3ScreenWidthHook"
address = 0x82724AE8
registers = ["f0"]

# Intro skip: sub_82A11638 compares a movie player's state (r3, just returned
# by the player's vtable +88) against the last one seen and fires the script
# callbacks for "playing" (2) and "stopped" (4).
[[midasm_hook]]
name = "Nhl3on3MovieStateHook"
address = 0x82A11668
registers = ["r3"]

# Menu text: the LocalizeString (sub_82AC3FC0) and LocalizeStringMixedCase
# (sub_82AC4040) script natives. Lookup hooks run once the result string at
# sp+80 is filled; convert hooks run after it was copied into a script value
# and before its destructor.
[[midasm_hook]]
name = "Nhl3on3LocalizeLookupHook"
address = 0x82AC400C
registers = ["r1"]

[[midasm_hook]]
name = "Nhl3on3LocalizeConvertHook"
address = 0x82AC4014
registers = ["r1"]

